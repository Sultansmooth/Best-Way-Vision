services:
  # Frontend - Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bestway-vision-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Backend API URL (uncomment when backend is ready)
      # - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
    networks:
      - bestway-network

